post:
  tags:
  - Orders
  operationId: confirmOrder
  summary: Confirmar
  description: |
    Informa a Onbeef que o pedido foi aceito e que o preparo será iniciado em breve.
  parameters:
  - $ref: '#/components/parameters/OrderId'
  security:
  - BearerAuth: []
  requestBody:
    $ref: '#/components/requestBodies/OrderStatus'
  responses:
    '202':
      description: Requisição aceita para processamento.
    '401':
      description: Requisição sem credenciais de autenticação válidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Pedido não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
