post:
  tags:
  - Orders
  operationId: orderTracking
  summary: Enviar Atualizações de Entrega
  description: |
    Envia informações sobre a entrega em andamento.
  parameters:
  - $ref: '#/components/parameters/OrderId'
  security:
  - BearerAuth: []
  requestBody:
    $ref: '#/components/requestBodies/OrderTracking'
  responses:
    '202':
      description: Requisição aceita para processamento.
    '401':
      description: Requisição sem credenciais de autenticação válidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Pedido não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
