post:
  tags:
  - Orders
  operationId: requestCancellation
  summary: Solicitar cancelamento do pedido
  description: |
    Solicitar cancelamento do pedido a Onbeef.
  parameters:
  - $ref: '#/components/parameters/OrderId'
  security:
  - BearerAuth: []
  requestBody:
    $ref: '#/components/requestBodies/requestCancellation'
  responses:
    '202':
      description: Requisição aceita para processamento.
    '401':
      description: Requisição sem credenciais de autenticação válidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Pedido não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '409':
      description: Pedido já está cancelado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
