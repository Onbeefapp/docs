post:
  tags:
  - Orders
  operationId: orderReady
  summary: Pronto para Retirada
  description: |
    Informa ao Onbeef que o pedido está pronto para retirada.
  parameters:
  - $ref: '#/components/parameters/OrderId'
  security:
  - BearerAuth: []
  responses:
    '202':
      description: Requisição aceita para processamento.
    '401':
      description: Requisição sem credenciais de autenticação válidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    '404':
      description: Pedido não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
