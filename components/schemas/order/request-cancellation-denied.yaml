type: object
properties:
  reason:
    type: string
    description: >-
      Campo de texto aberto para informar o motivo da negação do cancelamento.
  code:
    type: string
    enum:
    - SYSTEMIC_ISSUES
    - DUPLICATE_APPLICATION
    - UNAVAILABLE_ITEM
    - RESTAURANT_WITHOUT_DELIVERY_PERSON
    - OUTDATED_MENU
    - ORDER_OUTSIDE_THE_DELIVERY_AREA
    - BLOCKED_CUSTOMER
    - OUTSIDE_DELIVERY_HOURS
    - INTERNAL_DIFFICULTIES_OF_THE_RESTAURANT
    - RISK_AREA
    - DELIVERY_PROBLEM
required:
- reason
- code
