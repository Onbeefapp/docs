allOf:
- $ref: '#/components/schemas/MerchantUpdateRequest'
- type: object
  properties:
    updatedObjects:
      description: 'Updated `Merchant` entity objects'
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
            description: >-
              Identificador do estabelecimento no sistema do PDV. Armazenado pela Onbeef como referência externa do estabelecimento.
          status:
            type: string
            description: >-
              Indica se o estabelecimento está disponível ou indisponível. O status aplicado pela Onbeef é lido do campo `merchantStatus` no nível raiz da requisição.
            enum:
            - AVAILABLE
            - UNAVAILABLE
          items:
            type: array
            description: >-
              Entidade obrigatória a ser implementada. Descreve um array de produtos.
            items:
              $ref: '#/components/schemas/MerchantUpdateItemRequest'
          categories:
            type: array
            description: >-
              Descreve um array de seções do catálogo onde os ItemOffers serão exibidos. Produtos só são processados quando a categoria referencia a oferta (`itemOfferId`), a oferta existe em `itemOffers` e o produto correspondente existe em `items`.
            items:
              $ref: '#/components/schemas/MerchantUpdateCategoryRequest'
          itemOffers:
            type: array
            description: >-
              Entidade obrigatória a ser implementada. Descreve um array de ofertas para os produtos.
            items:
              $ref: '#/components/schemas/MerchantUpdateFullItemOfferRequest'
        required:
        - id
        - items
        - categories
        - itemOffers
