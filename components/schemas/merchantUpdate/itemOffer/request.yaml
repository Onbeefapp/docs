properties:
  itemId:
    type: string
    description: O valor do id da entidade Item correlacionado a esta entidade ItemOffer.
  price:
    type: object
    description: Preço da oferta do produto no catálogo.
    properties:
      value:
        type: number
        description: Valor do preço atual. É o valor aplicado ao produto na Onbeef.
      originalValue:
        type: number
        nullable: true
        description: Valor do preço original.
      currency:
        type: string
        nullable: true
        description: >-
          Código da moeda do preço.
    required:
    - value
required:
- itemId
- price
