properties:
  id:
    type: string
    format: uuid
    description: >-
      Identificador da categoria no sistema do PDV. A Onbeef usa esse valor para localizar uma categoria já vinculada ao estabelecimento: quando encontra, atualiza apenas o status e preserva o nome e a ordenação atuais; quando não encontra, cria uma nova categoria.
  name:
    type: string
    description: >-
      Nome da categoria. Utilizado apenas na criação; em categorias já vinculadas o nome atual é preservado.
  index:
    type: integer
    description: >-
      Posição da categoria na ordenação do catálogo. Utilizado apenas na criação; em categorias já vinculadas a ordenação atual é preservada.
  description:
    type: string
    description: Descrição da categoria.
  image:
    type: object
    description: Imagem da categoria.
    properties:
      url:
        type: string
        format: uri
        description: URL da imagem da categoria.
    required:
    - url
  externalCode:
    type: string
    description: Código externo da categoria (normalmente no PDV do merchant).
  status:
    type: string
    description: Status da categoria.
    enum:
    - AVAILABLE
    - UNAVAILABLE
  itemOfferId:
    type: array
    description: >-
      IDs das ofertas (campo `id` da entidade ItemOffer) exibidas nesta categoria. Cada id referenciado precisa existir no array `itemOffers`, e a oferta precisa apontar (`itemId`) para um produto existente no array `items`.
    items:
      type: string
required:
- id
- name
- index
- status
- itemOfferId
