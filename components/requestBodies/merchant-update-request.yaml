required: true
content:
  application/json:
    schema:
      type: object
      discriminator:
        propertyName: entityType
        mapping:
          MERCHANT: '#/components/schemas/MerchantUpdateRequestFull'
          ITEM: '#/components/schemas/MerchantUpdateRequestItem'
          ITEM_OFFER: '#/components/schemas/MerchantUpdateRequestItemOffer'
      properties:
        merchantStatus:
          type: string
          description: >-
            Indica se o estabelecimento está disponível ou não. Obrigatório em todas as requisições por compatibilidade, mas só é aplicado quando `entityType` é `MERCHANT`; em `ITEM` e `ITEM_OFFER` o campo é ignorado.
          enum:
          - AVAILABLE
          - UNAVAILABLE
        entityType:
          type: string
          description: 'O tipo de entidade do objeto atualizado.'
          enum:
          - MERCHANT
          - ITEM
          - ITEM_OFFER
        onlyAddProducts:
          type: boolean
          default: false
          description: >-
            Aplicável apenas quando `entityType` é `MERCHANT`. Se for true, os produtos serão adicionados ou atualizados sem remover os já existentes. Se for false (padrão quando omitido), além de adicionar e atualizar, a Onbeef remove as categorias e produtos vinculados ao PDV (identificador do PDV preenchido) que não constarem no payload. Categorias e produtos sem vínculo com o PDV nunca são removidos: o que define a remoção é o vínculo, não onde o registro foi criado.
        updatedObjects:
          type: array
          description: 'Lista de entidades atualizadas. O conteúdo varia conforme o `entityType` (ver schemas referenciados pelo discriminator).'
          items:
            type: object
      required:
      - entityType
      - merchantStatus
      - updatedObjects
    examples:
      MerchantUpdateRequestFullExample:
        $ref: '#/components/examples/MerchantUpdateRequestFullExample'
      MerchantUpdateRequestItemExample:
        $ref: '#/components/examples/MerchantUpdateRequestItemExample'
      MerchantUpdateRequestItemOfferExample:
        $ref: '#/components/examples/MerchantUpdateRequestItemOfferExample'
