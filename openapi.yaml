      $ref: './components/requestBodies/order-status.yaml'
    requestCancellation:
      $ref: './components/requestBodies/request-cancellation.yaml'
    requestCancellationDenied:
      $ref: './components/requestBodies/request-cancellation-denied.yaml'
    OrderTracking:
      $ref: './components/requestBodies/order-tracking.yaml'
paths:
  /oauth/token:
    $ref: './paths/oauth.yaml'
  /v1/merchant:
    $ref: './paths/merchant/merchant.yaml'
  /v1/merchantStatus:
    $ref: './paths/merchant/merchant-status.yaml'
  /v1/merchantOnboarding:
    $ref: './paths/merchant/merchant-onboarding.yaml'
  /v1/merchantUpdate:
    $ref: './paths/merchant/merchant-update.yaml'
  /v1/logistics/deliveryUpdate:
    $ref: './paths/logistics/delivery-update.yaml'
  /v1/logistics/confirmationCode:
    $ref: './paths/logistics/confirmation-code.yaml'
  /v1/events:polling:
    $ref: './paths/order/polling.yaml'
  /v1/events/acknowledgment:
    $ref: './paths/order/acknowledgement.yaml'
  /v1/orders/{orderId}:
    $ref: './paths/order/order-details.yaml'
  /v1/orders/{orderId}/confirm:
    $ref: './paths/order/order-confirm.yaml'
  /v1/orders/{orderId}/readyForPickup:
    $ref: './paths/order/order-ready-for-pickup.yaml'
  /v1/orders/{orderId}/dispatch:
    $ref: './paths/order/order-dispatch.yaml'
  /v1/orders/{orderId}/delivered:
    $ref: './paths/order/order-delivered.yaml'
  /v1/orders/{orderId}/validateCode:
    $ref: './paths/order/order-validate-code.yaml'
  /v1/orders/{orderId}/requestCancellation:
    $ref: './paths/order/order-request-cancellation.yaml'
  /v1/orders/{orderId}/acceptCancellation:
    $ref: './paths/order/order-accept-cancellation.yaml'
  /v1/orders/{orderId}/denyCancellation:
    $ref: './paths/order/order-deny-cancellation.yaml'
  /v1/orders/{orderId}/tracking:
    $ref: './paths/order/order-tracking.yaml'
tags:
- name: Autenticação
  description: A Onbeef suporta apenas autenticação OAuth 2.
- name: Merchant
  description: A entidade `Merchant` será utilizada pela Onbeef para recuperar todos os dados de um Merchant e apresentá-los ao usuário.
- name: Logistics
  description: Endpoints expostos pela Onbeef para receber notificações de eventos de entrega e validação de código de confirmação enviadas pelo operador logístico (webhooks recebidos pela Onbeef).
- name: Orders
  description: A entidade `Order` será utilizada para consultas completas e para a atualização das informações.
