    401InvalidCredentials:
      $ref: './components/examples/errors/401-invalid-credentials.yaml'
    500MerchantIdFieldRequired:
      $ref: './components/examples/errors/500-merchant-id-field-required.yaml'
    500MerchantStatusFieldRequired:
      $ref: './components/examples/errors/500-merchant-status-field-required.yaml'
    503InvalidBase64Characters:
      $ref: './components/examples/errors/503-invalid-base64-characters.yaml'
  requestBodies:
    TokenRequestBody:
      $ref: './components/requestBodies/token-request.yaml'
    MerchantOnboardingRequestBody:
      $ref: './components/requestBodies/merchant-onboarding-request.yaml'
    MerchantUpdateRequestBody:
      $ref: './components/requestBodies/merchant-update-request.yaml'
    DeliveryUpdate:
