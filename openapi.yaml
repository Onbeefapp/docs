openapi: 3.0.3
info:
  title: API Connect Onbeef
  description: |
    # Introdução

    Esta API segue o padrão **Open Delivery** e fornece recursos para:

    - **Autenticação**
    - **Gerenciamento de merchants** (informações, cardápios e status)
    - **Cadastro e atualização** de dados do merchant
    - **Recuperação de pedidos** e atualização de status
    - **Eventos de pedidos** e confirmações de entrega

    Documentação Open Delivery: <a href="https://abrasel-nacional.github.io/docs" target="_blank">https://abrasel-nacional.github.io/docs</a>

    # Changelog  

    Aqui você acompanha todas as atualizações, melhorias e correções realizadas na API de integrações da Onbeef.      
    No changelog estão documentadas as mudanças mais recentes para que sua integração esteja sempre atualizada.

    👉 Confira a versão completa:  
    [https://api.connect.onbeefapp.com.br/changelog](https://api.connect.onbeefapp.com.br/changelog)
  x-logo:
    url: 'https://onbeefapp.com.br/wp-content/uploads/2024/03/logo_onbeef.20b983ed-300x300.png'
  version: 1.0.0
  contact:
    email: rafael@onbeefapp.com.br
    url: 'https://onbeefapp.com.br'
servers:
- url: 'https://api.dev.connect.onbeefapp.com.br'
  description: Ambiente de Homologação (Sandbox)
- url: 'https://api.connect.onbeefapp.com.br'
  description: Ambiente de Produção
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MerchantId:
      $ref: './components/parameters/merchant-id.yaml'
    EventType:
      $ref: './components/parameters/event-type.yaml'
    OrderId:
      $ref: './components/parameters/order-id.yaml'
    XAppId:
      $ref: './components/headers/x-app-id.yaml'
    XAppMerchantId:
      $ref: './components/headers/x-app-merchant-id.yaml'
    XAppSignature:
      $ref: './components/headers/x-app-signature.yaml'
    StartAt:
      name: start_at
      in: query
      description: 'Data/hora inicial do filtro de eventos. Formatos aceitos: `Y-m-d` ou `Y-m-d H:i`.'
      required: false
      schema:
        type: string
        format: date
    EndAt:
      name: end_at
      in: query
      description: 'Data/hora final do filtro de eventos. Formatos aceitos: `Y-m-d` ou `Y-m-d H:i`.'
      required: false
      schema:
        type: string
        format: date
  schemas:
    TokenRequest:
      $ref: './components/schemas/token/request.yaml'
    TokenResponse:
      $ref: './components/schemas/token/response.yaml'
    TokenUnauthorized:
      $ref: './components/schemas/token/unauthorized.yaml'
    MerchantResponse:
      $ref: './components/schemas/merchant/response.yaml'
    Category:
      $ref: './components/schemas/category/response.yaml'
    Product:
      $ref: './components/schemas/product/response.yaml'
    ProblemDetails:
      $ref: './components/schemas/problem-details.yaml'
    MerchantStatusResponse:
      $ref: './components/schemas/merchantStatus/response.yaml'
    MerchantOnboardingRequest:
      $ref: './components/schemas/merchantOnboarding/request.yaml'
    MerchantOnboardingResponse:
      $ref: './components/schemas/merchantOnboarding/response.yaml'
    MerchantUpdateRequest:
      $ref: './components/schemas/merchantUpdate/request.yaml'
    MerchantUpdateRequestFull:
      $ref: './components/schemas/merchantUpdate/request-full.yaml'
    MerchantUpdateRequestItem:
      $ref: './components/schemas/merchantUpdate/request-item.yaml'
    MerchantUpdateRequestItemOffer:
      $ref: './components/schemas/merchantUpdate/request-item-offer.yaml'
    MerchantUpdateItemRequest:
      $ref: './components/schemas/merchantUpdate/item/request.yaml'
    MerchantUpdateItemOfferRequest:
      $ref: './components/schemas/merchantUpdate/itemOffer/request.yaml'
    MerchantUpdateFullItemOfferRequest:
      $ref: './components/schemas/merchantUpdate/itemOffer/request-full.yaml'
    MerchantUpdateCategoryRequest:
      $ref: './components/schemas/category/merchant-update-request-categories.yaml'
    DeliveryUpdateRequestBody:
      $ref: './components/schemas/logistics/delivery-update-request.yaml'
    ConfirmationCodeRequestBody:
      $ref: './components/schemas/logistics/confirmation-code-request.yaml'
    ConfirmationCodeResponseSuccess:
      $ref: './components/schemas/logistics/confirmation-code-response-success.yaml'
    PollingResponseSuccess:
      $ref: './components/schemas/order/polling-response-success.yaml'
    PollingResponseSuccessDefault:
      $ref: './components/schemas/order/polling-response-success-default.yaml'
    AcknowledgementEventsRequest:
      $ref: './components/schemas/order/acknowledgement-request.yaml'
    OrderDetailsSuccess:
      $ref: './components/schemas/order/order-details-success.yaml'
    OrderDetailsItemsRequest:
      $ref: './components/schemas/product/item/request.yaml'
    OrderStatusRequest:
      $ref: './components/schemas/order/order-status-request.yaml'
    requestCancellation:
      $ref: './components/schemas/order/request-cancellation.yaml'
    requestCancellationDenied:
      $ref: './components/schemas/order/request-cancellation-denied.yaml'
    OrderTrackingRequest:
      $ref: './components/schemas/order/order-tracking-request.yaml'
  examples:
    TokenRequestExample:
      $ref: './components/examples/token/token-request.yaml'
    TokenResponseSuccessExample:
      $ref: './components/examples/token/token-response-success.yaml'
    TokenResponseUnauthorizedExample:
      $ref: './components/examples/token/token-response-unauthorized.yaml'
    MerchantResponseSuccessExample:
      $ref: './components/examples/merchant/merchant-response-success.yaml'
    MerchantStatusResponseSuccessExample:
      $ref: './components/examples/merchant/merchant-status-response-success.yaml'
    MerchantOnboardingRequestBodyExample:
